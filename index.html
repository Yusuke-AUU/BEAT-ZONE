<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BEAT ZONE - リズムゲーム</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#050508">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BEAT ZONE">
</head>
<body>

<!-- ===== TITLE SCREEN ===== -->
<div id="screen-title" class="screen active">
  <div class="title-bg">
    <div class="scanlines"></div>
    <div class="grid-floor"></div>
  </div>
  <div class="title-content">
    <div class="title-logo">
      <span class="logo-beat">BEAT</span>
      <span class="logo-zone">ZONE</span>
    </div>
    <div class="title-sub">リズムゲーム / RHYTHM GAME</div>
    <button class="btn-start glow-pulse" onclick="Game.showSongSelect()">PRESS START</button>
  </div>
  <div class="title-keys-hint">
    <span>PC: S D / Z X C　　MOBILE: タップ</span>
  </div>
</div>

<!-- ===== SONG SELECT ===== -->
<div id="screen-select" class="screen">
  <div class="select-header">
    <button class="btn-back" onclick="Game.showTitle()">◀ BACK</button>
    <h2 class="select-title">SELECT TRACK</h2>
    <div class="select-difficulty">
      <button class="diff-btn active" data-diff="easy" onclick="Game.setDifficulty('easy')">EASY</button>
      <button class="diff-btn" data-diff="normal" onclick="Game.setDifficulty('normal')">NORMAL</button>
      <button class="diff-btn" data-diff="hard" onclick="Game.setDifficulty('hard')">HARD</button>
    </div>
  </div>
  <div class="song-list" id="song-list"></div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="screen-game" class="screen">
  <div class="game-ui-top">
    <div class="song-info-bar">
      <span id="ui-song-name">---</span>
      <span id="ui-difficulty" class="diff-label">EASY</span>
    </div>
    <div class="score-area">
      <div class="score-block">
        <span class="score-label">SCORE</span>
        <span class="score-value" id="ui-score">0</span>
      </div>
      <div class="score-block">
        <span class="score-label">COMBO</span>
        <span class="score-value" id="ui-combo">0</span>
      </div>
    </div>
  </div>

  <!-- Health bar -->
  <div class="health-bar-wrap">
    <div class="health-bar" id="health-bar"></div>
  </div>

  <!-- Progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <!-- Performance Gauge -->
  <div class="gauge-wrap">
    <div class="gauge-track">
      <div class="gauge-pass-marker"></div>
      <div class="gauge-fill warn" id="gauge-fill"></div>
    </div>
    <div class="gauge-label" id="gauge-label">0%</div>
  </div>

  <!-- Playfield -->
  <div class="playfield" id="playfield">
    <!-- Lane dividers -->
    <div class="lane-dividers">
      <div class="lane-div"></div>
      <div class="lane-div"></div>
    </div>
    <!-- Notes will be injected here -->
    <div id="notes-container"></div>
    <!-- Judge line -->
    <div class="judge-line"></div>
    <!-- Hit effects -->
    <div id="hit-effects"></div>
  </div>

  <!-- Judge text -->
  <div class="judge-display" id="judge-display"></div>

  <!-- Lane labels -->
  <div class="lane-labels">
    <div class="lane-label">LOW ♩</div>
    <div class="lane-label">MID ♪</div>
    <div class="lane-label">HIGH ♫</div>
  </div>

  <!-- Buttons -->
  <div class="buttons-area" id="buttons-area">
    <div class="btn-row single-row">
      <button class="note-btn" id="btn-0" data-lane="0"
        ontouchstart="Game.onTouch(0, true)" ontouchend="Game.onTouch(0, false)">
        <span class="btn-key">Z</span>
      </button>
      <button class="note-btn" id="btn-1" data-lane="1"
        ontouchstart="Game.onTouch(1, true)" ontouchend="Game.onTouch(1, false)">
        <span class="btn-key">X</span>
      </button>
      <button class="note-btn" id="btn-2" data-lane="2"
        ontouchstart="Game.onTouch(2, true)" ontouchend="Game.onTouch(2, false)">
        <span class="btn-key">C</span>
      </button>
    </div>
  </div>

  <button class="btn-pause" onclick="Game.pause()">⏸</button>
</div>

<!-- ===== PAUSE SCREEN ===== -->
<div id="screen-pause" class="screen overlay">
  <div class="pause-box">
    <h2>PAUSED</h2>
    <button class="btn-menu" onclick="Game.resume()">▶ RESUME</button>
    <button class="btn-menu" onclick="Game.quit()">✕ QUIT</button>
  </div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="screen-result" class="screen">
  <div class="result-box">
    <div class="result-rank" id="result-rank">S</div>
    <div class="result-title" id="result-song-name"></div>
    <div class="result-stats">
      <div class="stat-row"><span>SCORE</span><span id="res-score">0</span></div>
      <div class="stat-row"><span>MAX COMBO</span><span id="res-combo">0</span></div>
      <div class="stat-row"><span>PERFECT</span><span id="res-perfect">0</span></div>
      <div class="stat-row"><span>GOOD</span><span id="res-good">0</span></div>
      <div class="stat-row"><span>MISS</span><span id="res-miss">0</span></div>
      <div class="stat-row"><span>GAUGE</span><span id="res-gauge">0%</span></div>
      <div class="stat-row"><span>CLEAR</span><span id="res-clear">-</span></div>
    </div>
    <div class="result-actions">
      <button class="btn-menu" onclick="Game.retry()">↺ RETRY</button>
      <button class="btn-menu" onclick="Game.showSongSelect()">♪ SONG SELECT</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
